# REFERENCE ONLY. Not loaded by CAIPE: config/caipe-app-config.yaml keeps `mcp_servers: []`.
# Onboard this server by hand in the CAIPE UI (see docs/PHASE1_MANUAL_ONBOARDING.md); the values below are what to type.
# To seed it instead, paste this list under `mcp_servers:` in config/caipe-app-config.yaml and recreate caipe-ui:
#   docker compose up -d --force-recreate --no-deps caipe-ui
mcp_servers:
  - id: "k8s-readonly"
    name: "Kubernetes (read-only)"
    description: "Upstream containers/kubernetes-mcp-server in read-only mode: list/get resources, pod logs, events. No write tools."
    transport: "http"
    endpoint: "http://k8s-readonly-mcp:8000/mcp"
    enabled: true
  # Phase 3. The install's bundled mcp-jira (profile `jira`); credentials come from the install's .env
  # (ATLASSIAN_*), so the registration has NO credential source. The server exposes ~62 tools including
  # delete_issue: each agent's allowed_tools is the real restriction (see agents.seed.yaml).
  - id: "jira"
    name: "Jira"
    description: "Jira Cloud (project AIPLATFORM). Copilot: get_issue, search, add_comment, get_transitions, transition_issue. Support: get_issue, search."
    transport: "http"
    endpoint: "http://mcp-jira:8000/mcp"
    enabled: true
  # Phase 3. Same upstream image as `k8s-readonly`, but write-enabled (no --read-only) with a separate ServiceAccount
  # (rbac-agent-ops.yaml: deployments get/list/patch/update in `ledgerlite` only). Start it with scripts/mcp-ops-up.sh.
  # Only the Cluster Agent may use it, and only `resources_create_or_update`, behind approval.
  - id: "k8s-ops"
    name: "Kubernetes (Deployment update)"
    description: "Upstream containers/kubernetes-mcp-server with writes enabled. It also lists delete, exec and run tools, which Kubernetes refuses for this account. The only tool allowed for agents is resources_create_or_update."
    transport: "http"
    endpoint: "http://k8s-ops-mcp:8000/mcp"
    enabled: true
