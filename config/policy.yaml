# Who can reach what. Plain-file view of the permission model for the talk (SPEC section 4).
# CAIPE enforces it with team grants, per-agent allowed_tools and interrupt_on; this file is NOT read by CAIPE.
# `enforced_by` says where each rule really lives, so the slide and the system cannot drift apart silently.
agents:
  cluster-agent:        # chatops + subagent of incident-copilot
    tools_read: [k8s-readonly.pods_list_in_namespace, k8s-readonly.pods_get, k8s-readonly.pods_log, k8s-readonly.events_list, k8s-readonly.resources_list, k8s-readonly.resources_get]
    writes:
      - tool: k8s-ops.resources_create_or_update      # update a Deployment in ledgerlite, nothing else
        approval: required                            # interrupt_on in the agent record
  incident-copilot:     # ticket resolution; no cluster tools of its own
    subagents: [cluster-agent, knowledge-agent]
    tools_read: [jira.get_issue, jira.search, jira.get_transitions]
    skills: [jira-board]
    writes:
      - {tool: jira.add_comment, approval: none}
      - {tool: jira.transition_issue, approval: required, show_fields: [issue_key, transition_id]}
  knowledge-agent:
    tools_read: [knowledge-base.search, knowledge-base.fetch_document]
  support-agent:
    tools_read: [knowledge-base.search, knowledge-base.fetch_document, jira.get_issue, jira.search]
    skills: [jira-board]
    writes: []

personas:
  support:
    team: support
    user: joao.silva
    agents: [support-agent]
    knowledge_bases: [ledgerlite-product-docs]
  oncall:
    team: oncall
    user: beatriz.santos
    agents: [incident-copilot, cluster-agent, knowledge-agent]
    knowledge_bases: [ledgerlite-runbooks, ledgerlite-incidents, ledgerlite-product-docs]
  owner:
    team: owner
    user: miguel.ferreira
    agents: [incident-copilot, cluster-agent, knowledge-agent, support-agent]
    knowledge_bases: [ledgerlite-runbooks, ledgerlite-incidents, ledgerlite-product-docs]
    notes: Auditor view; reads traces and cost in Langfuse.

deny_always:
  - cluster: delete, scale, exec, patch of anything but Deployments, any namespace other than ledgerlite (Kubernetes RBAC of the copilot-ops account; the write server still lists those tools but they fail)
  - jira.create_issue, update_issue, delete_issue and every Jira tool not listed above
  - tickets without the label demo-ledgerlite (JQL in the skill and the prompts; not enforced by Jira permissions)
  - moving a ticket to Done (humans only; prompt rule, not enforced)

enforced_by:
  agent_access: team grants on each agent (CAIPE UI, Admin > Teams)
  kb_access: team grants on each datasource (CAIPE UI, Admin > Teams > Knowledge Bases)
  tool_allowlist: allowed_tools in each agent record (Jira exposes ~62 tools; the k8s-ops server exposes its write tools but only one is allowed)
  cluster_reads: k8s-readonly-mcp runs --read-only with a read-only ServiceAccount (copilot-readonly)
  cluster_write: k8s-ops-mcp (writes enabled, lists delete and exec tools too) uses ServiceAccount copilot-ops, the real limit (deployments get/list/patch/update in ledgerlite); approval on the one tool
  approval: interrupt_on in the cluster-agent record (resources_create_or_update) and the incident-copilot record (jira.transition_issue)
  shared_skill: jira-board (Skills) attached to incident-copilot and support-agent; instructions only
  parent_read_only: the Incident Copilot has no write tool of its own, but it can ask the cluster-agent subagent; a write would still stop at the approval card, and its prompt forbids asking (a prompt rule, D-46)
