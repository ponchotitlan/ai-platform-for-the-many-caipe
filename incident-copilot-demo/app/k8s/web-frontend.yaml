apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-frontend
  namespace: ledgerlite
  labels: {app: ledgerlite, tier: frontend}
spec:
  replicas: 1
  selector:
    matchLabels: {app: ledgerlite, tier: frontend}
  template:
    metadata:
      labels: {app: ledgerlite, tier: frontend}
    spec:
      containers:
        - name: web-frontend
          image: ledgerlite/web-frontend:v3.3.0
          imagePullPolicy: IfNotPresent
          env:
            - {name: CHECKOUT_URL, value: "http://checkout-api:8080/pay"}
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 5
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: web-frontend
  namespace: ledgerlite
  labels: {app: ledgerlite, tier: frontend}
spec:
  type: NodePort
  selector: {app: ledgerlite, tier: frontend}
  ports: [{port: 8080, targetPort: 8080, nodePort: 30080}]
