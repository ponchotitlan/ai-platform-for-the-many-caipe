# checkout-api v1.3.2: healthy baseline
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
  namespace: ledgerlite
  labels: {app: ledgerlite, tier: checkout}
  annotations:
    kubernetes.io/change-cause: "release 1.3.2"
spec:
  replicas: 1
  selector:
    matchLabels: {app: ledgerlite, tier: checkout}
  template:
    metadata:
      labels: {app: ledgerlite, tier: checkout}
      annotations:
        kubernetes.io/change-cause: "release 1.3.2"
    spec:
      containers:
        - name: checkout-api
          image: ledgerlite/checkout-api:v1.3.2
          imagePullPolicy: IfNotPresent
          env:
            - {name: GATEWAY_URL, value: "http://payments-gateway:8080/charge"}
            - {name: GATEWAY_TIMEOUT_MS, value: "5000"}
            - {name: GATEWAY_RETRIES, value: "2"}
            - {name: DB_HOST, value: postgres}
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /ready, port: 8080}
            periodSeconds: 5
            failureThreshold: 1
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 1
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
